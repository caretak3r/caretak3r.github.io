{{- /*
  Conditionally load Mermaid.js only on pages that contain a mermaid code block.
  Detection: render-codeblock-mermaid.html sets .Page.Store "hasMermaid" = true.
*/ -}}
{{- if .Store.Get "hasMermaid" -}}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  function getTheme() {
    return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'neutral';
  }

  function init() {
    mermaid.initialize({
      startOnLoad: false,
      theme: getTheme(),
      themeVariables: {
        primaryColor: '#B85825',
        primaryTextColor: '#3D2E1B',
        primaryBorderColor: '#3D2E1B',
        lineColor: '#3D2E1B',
        secondaryColor: '#F2E8D0',
        tertiaryColor: '#E8DCC4',
        background: '#F2E8D0',
        fontFamily: "'Inter', sans-serif"
      },
      flowchart: { useMaxWidth: true, htmlLabels: true },
      sequence:  { useMaxWidth: true },
      gantt:     { useMaxWidth: true }
    });
    mermaid.run({ querySelector: '.mermaid' });
  }

  init();
</script>
{{- end -}}
