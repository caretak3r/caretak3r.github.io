{{ define "main" }}
<div class="shell">

  <div class="page-head">
    <h1>404</h1>
    <div class="index">PAGE NOT FOUND</div>
  </div>

  <p class="lede">
    <em>The page you requested does not exist on this server.</em>
    Either it was moved, the URL was mistyped, or it never existed in the first place.
  </p>

  <div class="filter-row" style="margin-top: 32px;">
    <a href="{{ "/" | relURL }}" class="filter-btn"><button>← HOME</button></a>
    <a href="{{ "/engineering/" | relURL }}" class="filter-btn"><button>ENGINEERING</button></a>
    <a href="{{ "/research/" | relURL }}" class="filter-btn"><button>RESEARCH</button></a>
  </div>

  <div style="margin-top: 48px; font-family: var(--font-display); font-size: 11px; color: var(--muted); letter-spacing: 0.08em;">
    HTTP 404 · {{ now.Format "2006-01-02 15:04:05 MST" }}
  </div>

</div>
{{ end }}
