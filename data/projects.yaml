# Projects index — sourced from data file (no per-project Hugo pages).
# Each entry renders as a Variant A ledger card on the /projects/ index;
# the home page shows the first four.
#
# Adding a project: append a new entry below AND a matching SVG branch in
# `layouts/partials/proj-stamp.html`. The stamp design system (wax-seal
# aesthetic, frame rules, motif conventions) is documented in the comment
# block at the top of that partial. Read it before drawing.
#
# `url` is where the card goes when clicked: the live site when one exists,
# otherwise the source repository. `repo` is optional — set it only when
# `url` is a live site, and the card renders a secondary GITHUB link.
