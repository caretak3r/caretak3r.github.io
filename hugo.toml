baseURL = 'https://silent.engineer/'
defaultContentLanguage = 'en'
title = 'rohit gudi · silent.engineer'
ignoreLogs = ['warning-goldmark-raw-html']

# No theme — native layouts under /layouts/
# theme = ""

[params]
  brand = "R.GUDI"
  handle = "silent.engineer"
  description = "9-year DevSecOps engineer. Engineering and AI-augmented research notes."
  author = "Rohit Gudi"

  # Socials surfaced in footer + bio block
  github_url   = "https://github.com/caretak3r"
  linkedin_url = "https://www.linkedin.com/in/rohit-gudi-142093359/"
  x_url        = "https://x.com/caretak8r"
  email_url    = "mailto:gudi.k.rohit@gmail.com"

# ---- Top-bar nav (the 'view switcher' — 3 primary sections + brand) ----
[menu]
  [[menu.main]]
    name   = "HOME"
    url    = "/"
    weight = 10
  [[menu.main]]
    name   = "RESEARCH"
    url    = "/research/"
    weight = 20
  [[menu.main]]
    name   = "ENGINEERING"
    url    = "/engineering/"
    weight = 30

# ---- Markdown render config ----
[markup]
  [markup.goldmark.renderer]
    unsafe = true                 # allow raw HTML in MD (needed for embedded <p align="center"> images)

  [markup.goldmark.parser.attribute]
    block = true
    title = true

  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

  # Chroma syntax highlighting via class-based output;
  # the actual colors come from assets/css/chroma-tan.css (generated in Phase 2).
  [markup.highlight]
    codeFences        = true
    guessSyntax       = true
    lineNos           = false
    noClasses         = false
    tabWidth          = 2

# ---- Taxonomies ----
[taxonomies]
  category = 'categories'
  tag      = 'tags'

# ---- Permalinks (preserve existing /posts/SLUG/ URLs) ----
[permalinks]
  posts    = "/posts/:slug/"
  projects = "/projects/:slug/"
  research = "/research/:slug/"

# ---- Build / output ----
[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

# ---- Minify ----
[minify]
  disableHTML = false
  minifyOutput = false
